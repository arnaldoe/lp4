<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 1, 2, 3, 4 e 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4"> <!-- margin-top 4 padronização do Bootstrap -->
        <h4>Formulário 1</h4>
        <form>
            <div class="row mb-3"> <!-- margin-bottom 3 padronização do Bootstrap -->
                <div class="col">
                    <label for="firstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Mark">
                </div>
                <div class="col">
                    <label for="lastName" class="form-label">Last name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Otto">
                </div>
                <div class="col">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="username" placeholder="Username">
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" placeholder="City">
                </div>
                <div class="col-md-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" placeholder="State">
                </div>
                <div class="col-md-3">
                    <label for="zip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="zip" placeholder="Zip">
                </div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                    Agree to terms and conditions
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Submit form</button>
        </form>
    </div>



    <div class="container mt-4">
        <h4>Formulário 2</h4>
        <form>
            <div class="row mb-3">
                <div class="col-md-1">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control text-center" value="32" readonly>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" placeholder="Nome Completo do Cliente">
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" placeholder="cliente@dominio.com">
                </div>
                <div class="col-md-2">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" placeholder="Só números">
                </div>
            </div>
    
            <div class="row mb-3">
                <div class="col-md-2">
                    <label class="form-label">Nº Celular</label>
                    <input type="text" class="form-control" placeholder="Nº do celular">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Nº Telefone fixo</label>
                    <input type="text" class="form-control" placeholder="Nº telefone">
                </div>
                <div class="col-md-2">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" placeholder="ex: 88308070">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Logradouro</label>
                    <input type="text" class="form-control" placeholder="ex: Rua 1400">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Nº</label>
                    <input type="text" class="form-control" placeholder="Nº">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Bairro</label>
                    <input type="text" class="form-control" placeholder="Bairro">
                </div>
            </div>
    
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label">Cidade</label>
                    <input type="text" class="form-control" placeholder="Cidade">
                </div>
                <div class="col-md-1">
                    <label class="form-label">UF</label>
                    <input type="text" class="form-control" placeholder="UF">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select">
                        <option selected>Selecione</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>
            </div>
    
            <div class="d-flex justify-content-end gap-2"> <!-- Alinhamento direita -->
                <button type="reset" class="btn btn-danger">Resetar</button>
                <button type="submit" class="btn btn-success">Próximo</button>
            </div>
        </form>
    </div>
  
    

    <div class="container mt-4">
        <h4>Formulário 3</h4>

        <div class="text-center mt-4"> 
            <h2>Sample Form</h2> <!-- Título centralizado -->
        </div>

        <form>
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end"> <!-- Alinhamento do texto right + 2 blocos (2 + 4) -->
                    <label class="form-label">Partner Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Email ID</label>
                </div>
                <div class="col-md-4">
                    <input type="email" class="form-control">
                </div>
            </div>
    
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Legal Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Mobile</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
            </div>
    
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Address</label>
                </div>
                <div class="col-md-10">
                    <textarea class="form-control"></textarea>
                </div>
            </div>
    
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end">
                    <label class="form-label">Contract Start Date</label>
                </div>
                <div class="col-md-4">
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label">Contract Expiry Date</label>
                </div>
                <div class="col-md-4">
                    <input type="date" class="form-control">
                </div>
            </div>
    
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end">
                    <label class="form-label">Minimum Loan Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label">Maximum Loan Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>
            </div>
    
            <div class="row mb-3 align-items-center">
                <div class="col-md-2 text-end">
                    <label class="form-label">Interest Rate</label>
                </div>
                <div class="col-md-4">
                    <input type="number" step="0.01" class="form-control">
                </div>
                <div class="col-md-2 text-end">
                    <label class="form-label">Deposit Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>
            </div>
    
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>



    <div class="container mt-4">
        <div class="p-4">
            <h4 class="mb-3">Formulário 4</h4>
            <h2 class="mb-4">Novo Usuário</h2>
        
            <form>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" class="form-control" id="nome" placeholder="Informe o nome...">
                    </div>
                </div>
        
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="cpf" class="form-label">CPF:</label>
                        <input type="text" class="form-control" id="cpf" placeholder="Informe o CPF...">
                    </div>
                    <div class="col-md-7">
                        <label for="endereco" class="form-label">Endereço:</label>
                        <input type="text" class="form-control" id="endereco" placeholder="Informe o endereço...">
                    </div>
                    <div class="col-md-2">
                        <label for="nivel" class="form-label">Nível:</label>
                        <select class="form-select" id="nivel">
                            <option selected>---</option>
                            <option value="1">Administrador</option>
                            <option value="2">Usuário</option>
                        </select>
                    </div>
                </div>
        
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Informe o email...">
                    </div>
                    <div class="col-md-4">
                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" class="form-control" id="senha" placeholder="Informe a senha...">
                    </div>
                    <div class="col-md-2">
                        <label for="status" class="form-label">Status:</label>
                        <select class="form-select" id="status">
                            <option selected>---</option>
                            <option value="1">Ativo</option>
                            <option value="2">Inativo</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-success">Enviar</button>
                    <button type="reset" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
 


    <div class="container mt-4">
        <h4>Formulário 5</h4>
    </div>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="container" style="max-width: 600px;">   
    
            <div class="p-4 border rounded bg-light"> <!-- preench. interno em todos os lados do elemento -->
                <h2 class="mb-3">Billing Address</h2>
    
                <form>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="username" placeholder="Username">
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email <span class="text-muted">(Optional)</span></label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>
    
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="1234 Main St">
                    </div>
    
                    <div class="mb-3">
                        <label for="address2" class="form-label">Address 2 <span class="text-muted">(Optional)</span></label>
                        <input type="text" class="form-control" id="address2" placeholder="Apartment or suite">
                    </div>
    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="country" class="form-label">Country</label>
                            <select class="form-select" id="country">
                                <option selected>Choose...</option>
                                <option value="1">United States</option>
                                <option value="2">Canada</option>
                                <option value="3">Brazil</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="state" class="form-label">State</label>
                            <select class="form-select" id="state">
                                <option selected>Choose...</option>
                                <option value="1">California</option>
                                <option value="2">New York</option>
                                <option value="3">São Paulo</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="zip" class="form-label">Zip</label>
                            <input type="text" class="form-control" id="zip">
                        </div>
                    </div>
    
                    <button type="submit" class="btn btn-primary">Submit</button> <!-- adicionado -->
                </form>
            </div>
        </div>
    </div>

</body>
</html>
